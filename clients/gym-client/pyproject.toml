[project]
name = "threesim-gym"
version = "0.1.0"
description = "Gymnasium client for the 3D-Simulation-System physics API"
requires-python = ">=3.12"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

# 依赖来源固定走镜像（与 backend 同一套约定）：锁文件记 canonical 地址，
# 换台机器 `uv sync` 拿到的还是同一批包。
[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threesim_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
