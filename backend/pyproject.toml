[project]
name = "3dsim-backend"
version = "0.1.0"
description = "Backend service for 3D-Simulation-System"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "rapier3d==0.36.1",
  "arq>=0.28.0",
  "redis>=5.3.1",
  "numpy>=2.5.4",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

# 依赖来源固定为官方 PyPI。锁文件里记的就是 canonical 地址，
# 换台机器 `uv sync` 拿到的还是同一批包（版本与哈希一致）。
# 想用镜像加速时用环境变量 UV_DEFAULT_INDEX 临时覆盖，不要改这里。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 让 `app` 即使没装成 editable 也能被 import（uv run alembic 等场景更稳）
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是「把 Depends() 写在默认值里」，B008 得放行这些调用
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
